[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-deconv"
version = "0.1.0"
description = "Batch 3D deconvolution of confocal z-stacks (Olympus FV1000) for synapse quantification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "tifffile>=2023.7.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "oiffile>=2023.8.30",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0"]
dev = ["pytest>=7.0"]

[project.scripts]
synapse-deconv = "synapse_deconv.cli:main"

[tool.setuptools.packages.find]
include = ["synapse_deconv*"]

[tool.setuptools.package-data]
synapse_deconv = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
