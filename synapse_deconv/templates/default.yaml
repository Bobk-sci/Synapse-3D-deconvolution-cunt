# =============================================================================
# synapse_deconv -- configuration unique du pipeline
#
# Ce fichier pilote TOUT le batch. Deux runs avec le meme fichier donnent des
# resultats identiques au bit pres. L'empreinte ("config fingerprint") affichee
# dans le log est un hash des seuls parametres qui changent les valeurs de
# pixels : notez-la dans votre cahier de manip.
#
# Toutes les longueurs sont en micrometres, les longueurs d'onde en nanometres.
# =============================================================================

input:
  directory: data/raw
  patterns: ["*.oib", "*.oif", "*.ome.tif", "*.ome.tiff"]
  recursive: false

output:
  directory: results
  suffix: "_decon"
  overwrite: false
  # clip             : conserve la photometrie absolue -> comparaison inter-groupes valide
  # rescale_per_stack: normalise chaque stack -> JAMAIS pour une etude comparative
  bit_depth_policy: clip
  # Gain constant applique a TOUTES les images avant la conversion 16 bits.
  # Richardson-Lucy concentre les photons d'un punctum sur beaucoup moins de
  # voxels : le pic peut depasser 65535 meme si le brut n'etait pas sature.
  # Si le log signale du clipping, il propose la valeur a mettre ici -- utilisez
  # LA MEME pour toute l'etude, sinon les intensites ne sont plus comparables.
  intensity_scale: 1.0
  save_psf: true

metadata:
  # metadata = lit la taille de voxel dans le fichier, fallback ci-dessous si absente
  # config   = force les valeurs ci-dessous quoi qu'il arrive
  voxel_size_source: metadata
  # Valeurs de SECOURS, utilisees seulement si les metadonnees sont absentes.
  # Elles servent aussi de reference au controle de coherence : mettez-y la
  # taille de voxel REELLE de vos acquisitions (lisible avec `inspect`), sinon
  # vous recevrez un avertissement d'ecart a chaque image.
  fallback_xy_um: 0.095
  fallback_z_um: 0.30
  # Olympus stocke la position du centre du premier et du dernier plan
  # -> pas = (fin - debut) / (n - 1). Mettre "n" pour reproduire d'autres lecteurs.
  spacing_divisor: n_minus_1
  # Avertit si la valeur lue s'ecarte de plus de 25 % du fallback (erreur d'unite)
  tolerance_warn_ratio: 0.25
  read_channel_wavelengths: true

optics:
  numerical_aperture: 1.40
  magnification: 60.0
  # Huile d'immersion
  immersion_ri: 1.515
  immersion_ri_design: 1.515
  # Lamelle
  coverslip_ri: 1.515
  coverslip_ri_design: 1.515
  coverslip_thickness_um: 170.0
  coverslip_thickness_design_um: 170.0
  working_distance_um: 150.0
  # ---------------------------------------------------------------------------
  # DEUX PARAMETRES A VERIFIER -- ce sont eux qui pilotent l'aberration spherique
  # ---------------------------------------------------------------------------
  # Indice du milieu de montage :
  #   Fluoromount aqueux (Sigma)  ~ 1.40         <- valeur par defaut ici
  #   Fluoromount-G               ~ 1.39-1.40
  #   Mowiol                      ~ 1.41-1.45
  #   Vectashield (glycerol)      ~ 1.45
  #   ProLong Gold / Diamond durci~ 1.46-1.47
  #   PBS / milieu purement aqueux~ 1.33
  # ATTENTION : a 1.40 avec un objectif NA 1.40, l'ouverture utile est limitee
  # par le milieu lui-meme (angle critique). Le pipeline l'avertit au demarrage.
  sample_ri: 1.40
  # Profondeur des structures imagees SOUS LA LAMELLE, dans le tissu.
  # C'est le parametre le plus sensible quand il y a un mismatch d'indice :
  # avec huile 1.515 / Fluoromount 1.40, la FWHM axiale de la PSF TRIPLE entre
  # 0 et 10 um de profondeur. Lancer `synapse-deconv depth config/default.yaml`
  # pour voir l'effet sur VOTRE optique avant de choisir.
  #   cultures / cellules isolees      : 1-3 um
  #   ex vivo, imagerie pres du bord   : 5-10 um
  #   ex vivo, milieu d'une coupe      : demi-epaisseur de la coupe
  # En cas de doute, mieux vaut SURESTIMER que sous-estimer (cf. README §6.4).
  particle_depth_um: 8.0

# Un canal par marqueur, DANS L'ORDRE DES CANAUX DU FICHIER.
# Le nombre de canaux doit correspondre exactement au fichier.
# Nommez les canaux d'apres le MARQUEUR, pas le fluorophore : ce sont ces noms
# que la section 'colocalization' utilise pour attribuer les roles synaptiques.
# Verifiez que l'association marqueur <-> longueur d'onde correspond bien a
# votre marquage (`inspect` affiche les longueurs d'onde lues dans le fichier).
channels:
  - name: Bassoon            # presynaptique   -- Alexa 405
    emission_nm: 421
    excitation_nm: 405
  - name: PSD95              # post excitateur -- Alexa 488
    emission_nm: 519
    excitation_nm: 488
  - name: Gephyrin           # post inhibiteur -- Alexa 594
    emission_nm: 617
    excitation_nm: 594

psf:
  # gibson_lanni : gere le mismatch d'indice huile/echantillon (recommande)
  # born_wolf    : cas ideal sans mismatch (comparaison / debug)
  model: gibson_lanni
  # emission : PSF d'emission seule (equivalent grand champ) -- defaut
  # confocal : h_ex * (h_em (*) pinhole), plus fidele au FV1000, PSF plus fine
  mode: emission
  pinhole_airy_units: 1.0
  pinhole_radius_um: null
  # null = dimensionnement automatique a partir de l'optique et du voxel
  xy_size: null
  z_size: null
  # Sous-echantillonnage : indispensable a 0.095 um/pixel ou le coeur de la PSF
  # ne fait que ~2 pixels de large
  oversample_xy: 2
  oversample_z: 1
  center_on_peak: false
  integration_samples: 512
  radial_samples: 1024
  cache_dir: .psf_cache

background:
  # none       : Richardson-Lucy sur les comptes bruts (defaut, le plus neutre)
  # constant   : soustrait constant_value, identique pour toutes les images (sur)
  # percentile : estime le fond image par image (introduit une variabilite)
  method: none
  # Un seul nombre pour tous les canaux, OU une liste d'un nombre par canal
  # (dans l'ordre des canaux) : les piedestaux des PMT different souvent un peu.
  #   constant_value: 195
  #   constant_value: [202, 192, 192]
  constant_value: 0.0
  percentile: 0.1

deconvolution:
  algorithm: richardson_lucy
  iterations: 25
  backend: auto        # auto | numpy | cupy
  dtype: float32
  pad_mode: reflect    # reflect | edge | constant
  epsilon: 1.0e-9
  regularization: none # none | tv
  tv_lambda: 0.002

qc:
  enabled: true
  dpi: 150
  percentile_clip: [0.1, 99.9]
  # Gamma d'affichage du PNG uniquement (jamais applique aux donnees sauvees).
  # 0.5 = racine carree : garde les puncta faibles visibles a cote des tres vifs.
  display_gamma: 0.5
  include_xz: true
  subdirectory: qc

logging:
  level: INFO
  file: pipeline.log

processing:
  max_workers: 1
  fail_fast: false

# =============================================================================
# COMPTAGE DES SYNAPSES  (sous-commande `count`, sur les stacks deconvolues)
# =============================================================================

detection:
  # Diametres attendus des puncta, en um. Une echelle LoG par entree ; la
  # meilleure reponse par voxel est conservee.
  punctum_diameters_um: [0.25, 0.35, 0.50]
  # Seuil = mediane des MAXIMA LOCAUX + N x MAD de ces maxima. Calibrer sur les
  # maxima et non sur le volume entier est essentiel : la valeur typique d'un
  # maximum de bruit est tres au-dessus de la mediane du volume.
  # Le plateau est large (3 a 7 donnent souvent le meme resultat) -> parametre
  # peu critique, ce qui est exactement ce qu'on veut pour la reproductibilite.
  threshold_sigma: 5.0
  # Rayon du top-hat : DOIT depasser le plus grand rayon de punctum, sinon le
  # fond emporte les puncta. Definit aussi la bande de bord exclue (le top-hat
  # n'y est pas defini et y produit de faux puncta).
  background_radius_um: 1.0
  min_separation_um: 0.25
  min_volume_um3: 0.008
  max_volume_um3: 2.0
  # Seuil different par canal (a n'utiliser qu'avec une raison documentee) :
  #   threshold_sigma_per_channel: {Gephyrin: 4.0}
  threshold_sigma_per_channel: {}

colocalization:
  # distance : apposition centroide-a-centroide (defaut, adapte a la fente
  #            synaptique de 20-30 nm, sous la resolution)
  # contact  : masques segmentes qui se touchent apres dilatation
  criterion: distance
  # Distance 3D maximale, en um. EUCLIDIENNE PHYSIQUE : l'anisotropie du voxel
  # est deja prise en compte puisque les centroides sont en um.
  # C'est LE parametre a calibrer contre un comptage manuel.
  tolerance_um: 0.30
  contact_dilation_um: 0.10
  # Un punctum ne participe qu'a une seule synapse (assignation globalement
  # optimale). Desactiver gonfle les comptes en champ dense.
  one_to_one: true
  # Un punctum presynaptique proche a la fois de PSD-95 et de Gephyrin est
  # attribue au plus proche au lieu d'etre compte deux fois.
  resolve_ambiguous_partners: true
  # Controle de hasard : re-apparie apres translation aleatoire d'un canal,
  # pour mesurer combien de paires la tolerance donne par pure coincidence a
  # cette densite. A REGARDER : si le hasard depasse 25 % de l'observe, le
  # comptage est un majorant, pas une mesure.
  chance_randomisations: 10
  presynaptic: Bassoon
  postsynaptic_excitatory: PSD95
  postsynaptic_inhibitory: Gephyrin

analysis:
  # Masque 3D optionnel (non nul = interieur). null = tout le champ.
  roi_mask: null
  border_exclusion_um: 0.5
  density_unit_um3: 100.0
  # Alerte si la densite de puncta sort de cet intervalle (par 100 um3).
  expected_puncta_per_100um3: [0.5, 500.0]
  min_snr_warn: 3.0
  subdirectory: counts
